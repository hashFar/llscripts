<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Logic Lagao</title>
   <link rel="icon" type="image/jpg" href="logo.jpg">
   <link rel="stylesheet" href="style.css">
   <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>

<body>

   <!-- PAGE 1: LOGIN -->
   <div id="passwordScreen">
      <div class="pw-card">
         <div class="pw-title">Logic Lagao</div>
         <input type="email" id="emailInput" placeholder="Email" autocomplete="email">
         <input type="password" id="passwordInput" class="pw-input" placeholder="Password" autocomplete="off">
         <button class="pw-btn" id="enterBtn">Enter</button>
         <div class="pw-error" id="pwError"></div>
      </div>
   </div>

   <!-- PAGE 2: MAIN APP -->
   <div id="app">
      <div class="app-header">
         <div class="site-title">Logic Lagao</div>
         <div class="header-actions">
            <button class="theme-toggle-btn" id="themeToggleBtn" title="Toggle theme"
               aria-label="Toggle theme"></button>
            <button class="logout-btn" id="logoutBtn">Logout</button>
         </div>
      </div>

      <nav class="tabs">
         <button class="tab-btn active" data-tab="home">Home</button>
         <button class="tab-btn" data-tab="scripts">Scripts</button>
         <button class="tab-btn" data-tab="archive">Archive</button>
      </nav>

      <!-- HOME VIEW -->
      <div class="view active" id="homeView">
         <div id="homeList"></div>
      </div>

      <!-- SCRIPTS VIEW -->
      <div class="view" id="scriptsView">
         <div class="toolbar">
            <div class="filters">
               <button class="filter-btn active" data-filter="all">All</button>
               <button class="filter-btn" data-filter="not-approved">Not Approved</button>
               <button class="filter-btn" data-filter="approved">Approved</button>
               <button class="filter-btn" data-filter="not-done">Not Done</button>
               <button class="filter-btn" data-filter="done">Done</button>
               <button class="filter-btn" data-filter="rejected">Rejected</button>
            </div>
            <div class="filter-panel-wrapper">
               <button class="filter-btn filter-panel-toggle-btn" id="filterPanelBtn" type="button">Filter
                  &#9662;</button>
               <div class="filter-panel" id="filterPanel">
                  <div class="filter-panel-group">
                     <label for="nameFilterSelect">Name</label>
                     <select id="nameFilterSelect">
                        <option value="all">All</option>
                     </select>
                  </div>
                  <div class="filter-panel-group">
                     <label for="dateFilterSelect">Date</label>
                     <select id="dateFilterSelect">
                        <option value="all">All</option>
                        <option value="today">Today</option>
                        <option value="yesterday">Yesterday</option>
                        <option value="last7">Last 7 Days</option>
                        <option value="last30">Last 1 Month</option>
                     </select>
                  </div>
                  <div class="filter-panel-actions">
                     <button class="btn btn-secondary" id="filterClearBtn" type="button">Clear</button>
                     <button class="btn btn-primary" id="filterApplyBtn" type="button">Apply</button>
                  </div>
               </div>
            </div>
            <button class="add-btn" id="showAddFormBtn" title="Add script">+</button>
         </div>

         <div class="add-form" id="addForm">
            <label for="newTitle">Idea / Title</label>
            <input type="text" id="newTitle" placeholder="e.g. Why cats hate water">

            <label for="newDesc">Description</label>
            <textarea id="newDesc" rows="3" placeholder="Short description of the script"></textarea>

            <div class="form-actions">
               <button class="btn btn-secondary" id="cancelAddBtn">Cancel</button>
               <button class="btn btn-primary" id="submitAddBtn">Add Script</button>
            </div>
         </div>

         <div id="scriptsList"></div>
      </div>

      <!-- ARCHIVE VIEW -->
      <div class="view" id="archiveView">
         <h2 class="section-heading">Archived scripts</h2>
         <div id="archiveList"></div>
      </div>
   </div>



   <script src="script.js"></script>
</body>

</html>
